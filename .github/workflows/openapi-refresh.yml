name: OpenAPI Spec Drift

on:
  schedule:
    # Mondays at 06:00 UTC, to pick up upstream changes once a week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Detect drift
        id: drift
        run: |
          verdict="$(make openapi-drift-status)"
          case "$verdict" in
            changed=true|changed=false)
              echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "unexpected openapi-drift-status output: '$verdict'" >&2
              exit 1 ;;
          esac

      - name: Refresh spec
        if: steps.drift.outputs.changed == 'true'
        run: make openapi-refresh

      - name: Verify build still passes
        if: steps.drift.outputs.changed == 'true'
        run: make check

      - name: Open pull request
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/openapi-refresh
          title: "chore(openapi): refresh vendored spec"
          commit-message: "chore(openapi): refresh vendored spec"
          # Written by `make openapi-refresh`, which diffs the regenerated
          # manifest against the copy it replaced. The spec diff alone buries
          # the question this PR exists to ask.
          body-path: target/openapi-refresh-body.md
          add-paths: |
            openapi/openarchieven.yaml
            openapi/openarchieven.sha256
            openapi/params-manifest.json
