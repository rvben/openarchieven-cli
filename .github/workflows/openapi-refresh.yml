name: OpenAPI Spec Drift

on:
  schedule:
    # Mondays at 06:00 UTC, to pick up upstream changes once a week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: nextest
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Detect drift
        id: drift
        run: |
          verdict="$(make openapi-drift-status)"
          case "$verdict" in
            changed=true|changed=false)
              echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "unexpected openapi-drift-status output: '$verdict'" >&2
              exit 1 ;;
          esac

      - name: Refresh spec
        if: steps.drift.outputs.changed == 'true'
        run: make openapi-refresh

      - name: Verify build still passes
        if: steps.drift.outputs.changed == 'true'
        run: make check

      - name: Open pull request
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: chore/openapi-refresh
          title: "chore(openapi): refresh vendored spec"
          commit-message: "chore(openapi): refresh vendored spec"
          # Written by `make openapi-refresh`, which diffs the regenerated
          # manifest against the copy it replaced. The spec diff alone buries
          # the question this PR exists to ask.
          body-path: target/openapi-refresh-body.md
          add-paths: |
            openapi/openarchieven.yaml
            openapi/openarchieven.sha256
            openapi/params-manifest.json
