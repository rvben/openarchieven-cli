name: Dependency health

on:
  schedule:
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b015afc2c81f52fbffd862469203c076e32e6edf # v0.14.3
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      # tests/openapi_drift.rs and tests/openapi_refresh_body.rs run
      # `make openapi-drift-status` / `make openapi-refresh`, which are uv
      # scripts (see ci.yml). Without uv those tests fail rather than
      # silently skip.
      prepare-command: python3 -m pip install uv
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): refresh dependencies"
